# Vendorweergave voor tmux 3.7c. Hook.ts zet @vendor, @agent en @agent_naam.
# Zonder @vendor valt de badge terug op de gemeten procesnamen claude.exe en codex.
set -g pane-border-style "fg=#{?#{||:#{==:#{@vendor},codex},#{==:#{pane_current_command},codex}},#0b7259,#{?#{||:#{==:#{@vendor},claude},#{==:#{pane_current_command},claude.exe}},#9f4f38,#313244}}"
set -g pane-active-border-style "fg=#{?#{||:#{==:#{@vendor},codex},#{==:#{pane_current_command},codex}},#10a37f,#{?#{||:#{==:#{@vendor},claude},#{==:#{pane_current_command},claude.exe}},#d97757,#89b4fa}}"
set -g window-status-format " #{?#{||:#{==:#{@vendor},codex},#{==:#{pane_current_command},codex}},#[fg=#10a37f]⬢ #{?@agent_naam,#{@agent_naam},codex},#{?#{||:#{==:#{@vendor},claude},#{==:#{pane_current_command},claude.exe}},#[fg=#d97757]◆ #{?@agent_naam,#{@agent_naam},claude},#[fg=#6c7086]#I #W}} "
set -g window-status-current-format "#[bold]#{E:window-status-format}#[nobold]"
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-format " #{?#{||:#{==:#{@vendor},codex},#{==:#{pane_current_command},codex}},#[fg=#10a37f]#[bold]⬢ #{?@agent_naam,#{@agent_naam},codex}#[nobold],#{?#{||:#{==:#{@vendor},claude},#{==:#{pane_current_command},claude.exe}},#[fg=#d97757]#[bold]◆ #{?@agent_naam,#{@agent_naam},claude}#[nobold],#[fg=#6c7086]#{pane_index} #{pane_current_command}}}#{?@claude_model, #[fg=#cba6f7]#{@claude_model} #{@claude_ctx}#{?@claude_cost, #[fg=#6c7086]· #{@claude_cost},}#{?@agent_state, #[fg=#6c7086]· #{@agent_state},},} "
